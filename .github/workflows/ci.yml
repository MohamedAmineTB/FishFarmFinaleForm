name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back end (lint, tests, evals)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fishfarm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fishfarm_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fishfarm_test
      LLM_PROVIDER: mock
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check app tests alembic
          ruff format --check app tests alembic
      - name: Tests (API, tenancy, pipeline, ML, assistant, golden set)
        run: pytest -q
      - name: Evaluation report on a fresh demo farm
        run: |
          python -m app.seed --reset
          python -m app.assistant.evals
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results.json

  frontend:
    name: Front end (lint, format, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fishfarm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/fishfarm
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API and the pipeline on a seeded demo farm
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.seed
          python -m app.assistant.ingest
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          nohup python -m app.pipeline.runner > ../pipeline.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        run: tail -n 100 api.log pipeline.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  docker:
    name: docker compose up (no API key)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through the front-end proxy
        run: |
          curl -sf localhost:8080/ | grep -q "<div id=\"root\">"
          curl -sf localhost:8080/api/health
          curl -sf localhost:8080/api/public/showcase | grep -q '"available":true'
          TOKEN=$(curl -sf -X POST localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"nadia@lacvert.farm","password":"demo1234","portal":"owner"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          curl -sf localhost:8080/api/me -H "Authorization: Bearer $TOKEN" | grep -q '"demo_mode":true'
          curl -sfN -X POST localhost:8080/api/chat/stream -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"message":"What is my risk today?"}' | grep -q "event: done"
      - if: always()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down -v
